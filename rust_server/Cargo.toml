[package]
name = "rust_server"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0.102"
# a fork of btleplug that adds the device appearance value to advertisements on Windows/Linux and the extended characteristic properties on Windows/Linux
btleplug = { version = "0.12", features = ["serde"], git = "https://github.com/stevennyman/btleplug", branch = "webbt" }
dbus = { version = "0.9.11", features = ["vendored"] }
futures-lite = "2.6.1"
serde_json = "1.0.147"
single-instance = "0.3.3"
tokio = { version = "1", features = ["full"] }
uuid = "1.23.1"
webextension-native-messaging = "1.0.1"

[build-dependencies]
winresource = "0.1.31"

[[bin]]
name="BLEServer"
path="src/main.rs"

[package.metadata.winresource]
OriginalFilename = "BLEServer.exe"
LegalCopyright = "Copyright © 2026, Steven Nyman. License: MIT."
ProductName = "WebBT Server"
FileDescription = "Web Bluetooth Host Process"
