[package]
name = "rust_server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
btleplug = { version = "0.12", features = ["serde"], path = "../../btleplug" }
futures-lite = "2.6.1"
serde_json = "1.0.147"
single-instance = "0.3.3"
tokio = { version = "1", features = ["full"] }
uuid = "1.23.1"
webextension-native-messaging = "1.0.1"
# native_messaging = { version = "0.2.0", default-features = false, features = ["tokio", "install", "windows-registry"] }

[[bin]]
name="BLEServer"
path="src/main.rs"
