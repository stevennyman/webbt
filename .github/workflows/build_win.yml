name: Build Windows
on:
    workflow_dispatch:

jobs:
    Build_Windows:
        runs-on: windows-latest
        
        steps:
            - name: Checkout repo
              uses: actions/checkout@v6

            - name: Install Rust targets
              run: |
                rustup update stable
                rustup default stable
                rustup target add aarch64-pc-windows-msvc i686-pc-windows-msvc x86_64-pc-windows-msvc

            - name: Compile Rust release
              run: |
                cd rust_server
                cargo build --release --target aarch64-pc-windows-msvc
                cargo build --release --target i686-pc-windows-msvc
                cargo build --release --target x86_64-pc-windows-msvc
            
            - name: Upload ARM64 artifact
              uses: actions/upload-artifact@v4
              with:
                name: BLEServer-Rust-ARM64
                path: rust_server\target\aarch64-pc-windows-msvc\release\BLEServer.exe
            
            - name: Upload x64 artifact
              uses: actions/upload-artifact@v4
              with:
                name: BLEServer-Rust-x64
                path: rust_server\target\x86_64-pc-windows-msvc\release\BLEServer.exe
            
            - name: Upload x86 artifact
              uses: actions/upload-artifact@v4
              with:
                name: BLEServer-Rust-x86
                path: rust_server\target\i686-pc-windows-msvc\release\BLEServer.exe

            - name: Compile installer
              run: |
                iscc installer\windows\installer.iss

            - name: Upload installer
              uses: actions/upload-artifact@v4
              with:
                name: Installer
                path: installer\windows\output\*
